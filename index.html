<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111111"/>
<link rel="manifest" href="manifest.json"/>

<title>HYROX 26.09</title>
<style>
:root {
  --bg:#0c0c0c; --card:#171717; --muted:#9e9e9e; --text:#f7f7f7;
  --accent:#d7ff3f; --line:#2c2c2c; --danger:#ff7b7b;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
header{position:sticky;top:0;z-index:10;background:rgba(12,12,12,.94);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
.kicker{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:26px;line-height:1.05;margin:5px 0 4px}
.sub{font-size:13px;color:var(--muted)}
main{padding:18px;max-width:720px;margin:auto}
.today-card,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.today-card{border-color:#3d4717;box-shadow:0 0 0 1px rgba(215,255,63,.05)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#242424;color:#ddd;font-size:12px}
.bigdate{font-size:14px;color:var(--muted);margin-top:5px}
.workout-title{font-size:24px;font-weight:800;margin:8px 0 12px}
ul{padding-left:20px;margin:10px 0 0}
li{margin:8px 0;line-height:1.35}
.controls{display:flex;gap:8px;margin:14px 0;overflow:auto;padding-bottom:3px}
button{appearance:none;border:1px solid var(--line);background:#181818;color:white;border-radius:12px;padding:10px 13px;font-weight:700}
button.active{background:var(--accent);color:#111;border-color:var(--accent)}
button.complete{width:100%;background:#242424;margin-top:14px}
button.complete.done{background:var(--accent);color:#111}
.week-title{font-size:18px;margin:22px 2px 10px}
.day{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.day:first-of-type{border-top:0}
.dow{font-size:12px;color:var(--muted);text-transform:uppercase}
.dom{font-size:23px;font-weight:800}
.daytitle{font-weight:700}
.daymeta{font-size:12px;color:var(--muted);margin-top:3px}
.check{font-size:20px;color:var(--accent)}
.hidden{display:none}
.progress-wrap{height:8px;background:#252525;border-radius:99px;overflow:hidden;margin-top:12px}
.progress{height:100%;background:var(--accent);width:0}
.footer-nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(12,12,12,.96);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center}
.footer-nav button{flex:1;max-width:220px}
.note{color:var(--muted);font-size:12px;line-height:1.4;margin-top:10px}
.race{border-color:var(--accent);box-shadow:0 0 0 1px rgba(215,255,63,.15)}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f6f6;--card:#fff;--text:#111;--muted:#666;--line:#ddd;--accent:#b7df00}
  header,.footer-nav{background:rgba(246,246,246,.94)} button{background:#fff;color:#111} button.complete{background:#eee}
}
</style>
</head>

HYROX específico", "type": "hyrox", "details": ["1 km de corrida a 4:35–4:45/km", "500 m SkiErg", "1 km de corrida", "4 × 12,5 m sled push + sled pull", "1 km de corrida", "40 m burpee broad jumps", "1 km de corrida", "500 m remo", "1 km de corrida", "100 m farmer carry", "50 m walking lunges", "40 wall balls", "RPE: 7–8, sem procurar resultado máximo"]}, {"date": "2026-09-13", "week": "Semana 7–13 setembro — Pico específico", "title": "Longão", "type": "run", "details": ["11–12 km em Z2", "Ritmo aproximado: 5:25–5:40/km", "Volume semanal estimado: 40–42 km"]}, {"date": "2026-09-14", "week": "Semana 14–20 setembro — Redução da carga", "title": "Velocidade controlada", "type": "run", "details": ["2 km de aquecimento", "6 × 400 m a 4:05–4:10/km", "Recuperação: 90 s", "1,5–2 km de arrefecimento"]}, {"date": "2026-09-15", "week": "Semana 14–20 setembro — Redução da carga", "title": "Condição e força HYROX reduzida", "type": "strength", "details": ["Deadlift: 3 × 4", "Front squat: 3 × 5", "Supino: 3 × 6", "Remada: 3 × 8", "Shoulder press: 2 × 8", "Condicionamento — 3 voltas:", "400 m SkiErg", "15 m sled push", "15 m sled pull", "10 burpees", "15 wall balls", "Realizar apenas 60–70% do volume habitual", "RPE: 6–7"]}, {"date": "2026-09-16", "week": "Semana 14–20 setembro — Redução da carga", "title": "Corrida fácil + braços", "type": "run", "details": ["Corrida: 7 km em Z2", "Bíceps: 2 × 10", "Tríceps: 2 × 10", "Face pulls: 2 × 12", "Pallof press: 3 × 10 por lado"]}, {"date": "2026-09-17", "week": "Semana 14–20 setembro — Redução da carga", "title": "Ritmo de prova", "type": "run", "details": ["2 km de aquecimento", "2 × 3 km a 4:20–4:25/km", "Recuperação: 3 min de trote", "1,5 km de arrefecimento"]}, {"date": "2026-09-18", "week": "Semana 14–20 setembro — Redução da carga", "title": "Descanso", "type": "recovery", "details": ["Descanso completo", "Mobilidade ligeira"]}, {"date": "2026-09-19", "week": "Semana 14–20 setembro — Redução da carga", "title": "HYROX reduzido", "type": "hyrox", "details": ["3 voltas:", "800 m de corrida a 4:35–4:45/km", "400 m SkiErg", "20 m burpee broad jumps", "20 m farmer carry", "15 wall balls", "Recuperação: 2 min entre voltas", "RPE máximo: 7"]}, {"date": "2026-09-20", "week": "Semana 14–20 setembro — Redução da carga", "title": "Longão reduzido", "type": "run", "details": ["9–10 km em Z2, confortável", "Volume semanal estimado: 32–35 km"]}, {"date": "2026-09-21", "week": "Semana 21–26 setembro — Semana da prova", "title": "Corrida fácil + ativação superior", "type": "run", "details": ["6 km fáceis", "4 × 80 m progressivos", "Supino: 2 × 6, leve", "Remada: 2 × 8", "Bíceps e tríceps: 2 × 10", "Prancha: 2 × 40 s"]}, {"date": "2026-09-22", "week": "Semana 21–26 setembro — Semana da prova", "title": "Ativação HYROX", "type": "hyrox", "details": ["2 voltas, sem acumular fadiga:", "400 m SkiErg", "10 wall balls leves", "10 m sled push", "10 m sled pull", "20 m farmer carry", "8 burpees controlados", "Goblet squat: 2 × 8", "Shoulder press: 2 × 8", "Lat pulldown: 2 × 8", "RPE máximo: 5–6"]}, {"date": "2026-09-23", "week": "Semana 21–26 setembro — Semana da prova", "title": "Descanso", "type": "recovery", "details": ["Caminhada e mobilidade ligeira"]}, {"date": "2026-09-24", "week": "Semana 21–26 setembro — Semana da prova", "title": "Ativação de ritmo", "type": "run", "details": ["1,5 km de aquecimento", "2 × 1 km a 4:20/km", "Recuperação: 3 min", "1,5 km de arrefecimento", "3 × 80 m progressivos"]}, {"date": "2026-09-25", "week": "Semana 21–26 setembro — Semana da prova", "title": "Descanso completo", "type": "recovery", "details": ["Sem força, HYROX ou corrida"]}, {"date": "2026-09-26", "week": "Semana 21–26 setembro — Semana da prova", "title": "10 KM — PROVA", "type": "race", "details": ["2 km de aquecimento muito leve", "Mobilidade dinâmica", "4 × 60–80 m progressivos", "Km 1–2: 4:23–4:25/km", "Km 3–8: 4:18–4:20/km", "Km 9–10: acelerar progressivamente conforme a capacidade", "Objetivo final: 43:20"]}];
const locale='pt-PT';

function key(d){ return 'hyrox_done_'+d; }
function isDone(d){ return localStorage.getItem(key(d))==='1'; }
function toggleDone(d){
  localStorage.setItem(key(d), isDone(d)?'0':'1');
  render();
}
function fmtDate(s){
  const d=new Date(s+'T12:00:00');
  return d.toLocaleDateString(locale,{weekday:'long',day:'numeric',month:'long'});
}
function dow(s){ return new Date(s+'T12:00:00').toLocaleDateString(locale,{weekday:'short'}).replace('.',''); }
function dom(s){ return new Date(s+'T12:00:00').getDate(); }

function todayISO(){
  const now=new Date();
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function workoutCard(w, today=false){
  if(!w) return `<div class="today-card"><div class="workout-title">Sem treino planeado</div><div class="note">Usa a vista Plano para consultar todas as sessões.</div></div>`;
  const done=isDone(w.date);
  return `<div class="${today?'today-card':'card'} ${w.type==='race'?'race':''}">
    <div class="row"><span class="badge">${w.week}</span><span class="badge">${w.type.toUpperCase()}</span></div>
    <div class="bigdate">${fmtDate(w.date)}</div>
    <div class="workout-title">${w.title}</div>
    <ul>${w.details.map(x=>`<li>${x}</li>`).join('')}</ul>
    <button class="complete ${done?'done':''}" onclick="toggleDone('${w.date}')">${done?'✓ Treino concluído':'Marcar como concluído'}</button>
  </div>`;
}
function showToday(){
  document.getElementById('todayView').classList.remove('hidden');
  document.getElementById('calendarView').classList.add('hidden');
  document.getElementById('btnToday').classList.add('active');
  document.getElementById('btnPlan').classList.remove('active');
}
function showPlan(){
  document.getElementById('todayView').classList.add('hidden');
  document.getElementById('calendarView').classList.remove('hidden');
  document.getElementById('btnPlan').classList.add('active');
  document.getElementById('btnToday').classList.remove('active');
}
function openWorkout(date){
  const w=PLAN.find(x=>x.date===date);
  document.getElementById('todayView').innerHTML=workoutCard(w,true);
  showToday();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  const t=todayISO();
  const w=PLAN.find(x=>x.date===t);
  document.getElementById('todayView').innerHTML=workoutCard(w,true);
  const groups={};
  PLAN.forEach(x=>{(groups[x.week]??=[]).push(x)});
  let html='';
  Object.entries(groups).forEach(([week,items])=>{
    html+=`<div class="card"><div class="week-title">${week}</div>`;
    items.forEach(x=>{
      html+=`<div class="day" onclick="openWorkout('${x.date}')">
        <div><div class="dow">${dow(x.date)}</div><div class="dom">${dom(x.date)}</div></div>
        <div><div class="daytitle">${x.title}</div><div class="daymeta">${x.details[0]}</div></div>
        <div class="check">${isDone(x.date)?'✓':'›'}</div>
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('calendarView').innerHTML=html;

  const done=PLAN.filter(x=>isDone(x.date)).length;
  document.getElementById('progress').style.width=(done/PLAN.length*100)+'%';
}
render();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>

</html>
